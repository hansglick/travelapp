<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bagues d'analyse</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="map"></div>
<script>
  // Démonstration des états d'analyse web d'un lieu (même dessin que poiIcon dans index.html) :
  // en cours (arcs qui tournent), confirmé (bague verte), peut-être (bague orange), écarté (grisé)
  const CHECK_RING = { confirmed: "#2ecc71", maybe: "#f39c12" };
  const GLYPH = '<path d="M6 2h1.5v7h1V2H10v7h1V2h1.5v8a3 3 0 0 1-2.2 2.9V22H8.2v-9.1A3 3 0 0 1 6 10zM18 2v20h-2.2v-8H14V7c0-2.8 1.6-5 4-5z"/>';

  function icon(step, color, status) {
    if (status === "rejected") color = "#8d8d8d";
    let around = "";
    if (CHECK_RING[status]) around = `<circle cx="22" cy="32" r="23.5" fill="none" stroke="${CHECK_RING[status]}" stroke-width="4"/>`;
    else if (status === "pending") {
      const spin = (dur, reverse) => `<animateTransform attributeName="transform" type="rotate" from="${reverse ? 360 : 0} 22 32" to="${reverse ? 0 : 360} 22 32" dur="${dur}s" repeatCount="indefinite"/>`;
      around = `<g>${spin(1.2)}<path d="M22 8.5a23.5 23.5 0 0 1 23.5 23.5" fill="none" stroke="#1f2937" stroke-width="6" stroke-linecap="round" opacity="0.55"/><path d="M22 8.5a23.5 23.5 0 0 1 23.5 23.5" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></g>
        <g>${spin(1.8, true)}<path d="M22 55.5a23.5 23.5 0 0 1-23.5-23.5" fill="none" stroke="#1f2937" stroke-width="6" stroke-linecap="round" opacity="0.55"/><path d="M22 55.5a23.5 23.5 0 0 1-23.5-23.5" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></g>`;
    }
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="74" height="66" viewBox="-6 -6 74 66">${around}
      <g${status === "rejected" ? ' opacity="0.6"' : ""}><circle cx="22" cy="32" r="19" fill="${color}" stroke="#fff" stroke-width="3"/>
      <g transform="translate(10 20)" fill="#fff">${GLYPH}</g>
      <circle cx="42" cy="12" r="10" fill="${color}" stroke="#fff" stroke-width="2"/>
      <text x="42" y="16.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">${step}</text></g></svg>`;
    return { url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg), scaledSize: new google.maps.Size(74, 66), anchor: new google.maps.Point(28, 38) };
  }

  window.initMap = async () => {
    const { Map } = await google.maps.importLibrary("maps");
    const { Marker } = await google.maps.importLibrary("marker");
    const center = { lat: 48.8164, lng: 2.3285 };
    const map = new Map(document.getElementById("map"), { center, zoom: 17, mapId: "5d9eb529da45a90f564c4471", disableDefaultUI: true });
    const states = ["pending", "confirmed", "maybe", "rejected"];
    states.forEach((status, i) => new Marker({
      map, optimized: false, title: status, icon: icon(i + 1, "#e4572e", status),
      position: { lat: center.lat, lng: center.lng - 0.0012 + i * 0.0008 },
    }));
  };

  fetch("/api/config").then((r) => r.json()).then(({ googleMapsKey }) => {
    const s = document.createElement("script");
    s.src = `https://maps.googleapis.com/maps/api/js?key=${googleMapsKey}&loading=async&callback=initMap&v=weekly`;
    s.async = true;
    document.head.append(s);
  });
</script>
</body>
</html>
