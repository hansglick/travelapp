<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Démo icône « i »</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; }
  header h1 { margin: 0; font-size: 1.05rem; font-weight: 600; }
  header small { color: #999; }
  header button { padding: 8px 14px; border: 0; border-radius: 999px; background: #e4572e; color: #fff; font: 600 0.85rem system-ui, sans-serif; cursor: pointer; }
  #map { flex: 1; margin: 0 16px 16px; border-radius: 14px; overflow: hidden; }

  /* Icône « i » : pastille noire, « i » blanc, en haut à gauche de la carte */
  .info-btn {
    position: relative; width: 44px; height: 44px; margin: 12px; padding: 0;
    border: 0; border-radius: 50%; background: #000; color: #fff; cursor: pointer;
    font: italic 700 23px/44px Georgia, "Times New Roman", serif;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
  }
  /* Ondes sonar orange (deux anneaux décalés) */
  .info-btn::before, .info-btn::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    border: 3px solid #000; opacity: 0; pointer-events: none;
  }
  /* Diable en boîte : s'écrase, bondit en grossissant, retombe avec un petit rebond ; les ondes
     partent quand il retombe */
  .info-btn.nudge { animation: jack 0.9s cubic-bezier(0.3, 0.7, 0.4, 1) both; }
  .info-btn.nudge::before { animation: sonar 1.9s ease-out 0.42s; }
  .info-btn.nudge::after { animation: sonar 1.9s ease-out 1s; }
  @keyframes jack {
    0%   { transform: translateY(0) scale(1, 1); }
    14%  { transform: translateY(3px) scale(1.12, 0.8); }
    40%  { transform: translateY(-15px) scale(1.18, 1.18); }
    58%  { transform: translateY(0) scale(1.08, 0.92); }
    74%  { transform: translateY(-4px) scale(1.02, 1.02); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes sonar {
    0%   { transform: scale(1); opacity: 0.9; }
    100% { transform: scale(3.6); opacity: 0; }
  }

  /* Fenêtre 2 × 2 */
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, 0.6); }
  .overlay[hidden] { display: none; }
  .panel { width: 100%; max-width: 380px; padding: 18px 16px 16px; border: 1px solid #555; border-radius: 16px; background: #000; }
  .panel h2 { margin: 0 0 16px; color: #fff; font-size: 1.05rem; font-weight: 400; text-align: center; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile {
    display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 8px;
    border: 1px solid #2a2a2a; border-radius: 14px; background: #0d0d0d; color: #fff; cursor: pointer;
    font: 600 0.85rem system-ui, sans-serif;
  }
  .tile:hover { border-color: #555; }
  .tile svg { width: 40px; height: 40px; }
  .note { margin: 14px 0 0; color: #888; font-size: 0.8rem; text-align: center; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Démo : icône « i » (diable en boîte + ondes noires)</h1>
      <small>Première animation 10 s après l'affichage de la carte, puis toutes les 20 s. Touche l'icône pour la fenêtre 2 × 2.</small>
    </div>
    <button id="replay" type="button">Rejouer l'animation</button>
  </header>
  <div id="map"></div>

  <div id="overlay" class="overlay" hidden>
    <div class="panel">
      <h2>Informations utiles</h2>
      <div class="grid">
        <button class="tile" type="button">
          <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="18" cy="17" r="6"/><path d="M18 5v3M18 26v3M6 17h3M27 17h3M9.5 8.5l2 2M24.5 8.5l-2 2M9.5 25.5l2-2"/>
            <path d="M17 39h19a7 7 0 0 0 .5-14 10 10 0 0 0-19 3 5.5 5.5 0 0 0-.5 11z" fill="#000"/>
          </svg>
          Météo
        </button>
        <button class="tile" type="button">
          <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M24 6a12 12 0 0 0-7 21.7c1.3 1 2 2.4 2 4V34h10v-2.3c0-1.6.7-3 2-4A12 12 0 0 0 24 6z"/><path d="M19 39h10M21 43h6M24 12v6M21 15h6"/>
          </svg>
          Fun facts
        </button>
        <button class="tile" type="button">
          <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 10h22a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H15l-6 5v-5H6a3 3 0 0 1-3-3V13a3 3 0 0 1 3-3z"/>
            <path d="M35 18h7a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3h-2v5l-6-5h-9a3 3 0 0 1-3-3v-1"/>
          </svg>
          Guide
        </button>
        <button class="tile" type="button">
          <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 9h26v28a4 4 0 0 0 4 4H12a3 3 0 0 1-3-3z"/><path d="M35 17h5v20a4 4 0 0 1-4 4"/>
            <path d="M14 15h16M14 21h7M14 27h7M14 33h16"/><rect x="24" y="20" width="6" height="8"/>
          </svg>
          Actualités
        </button>
      </div>
      <p class="note">Démo : les tuiles ouvriront les fiches de l'appli.</p>
    </div>
  </div>

<script>
  const FIRST_MS = 10000, EVERY_MS = 20000;
  let infoBtn;

  function nudge() {
    if (!infoBtn) return;
    infoBtn.classList.remove("nudge");
    void infoBtn.offsetWidth; // relance l'animation
    infoBtn.classList.add("nudge");
  }

  document.getElementById("replay").addEventListener("click", nudge);
  const overlay = document.getElementById("overlay");
  overlay.addEventListener("click", (e) => { if (e.target === overlay || e.target.closest(".tile")) overlay.hidden = true; });

  window.initMap = async () => {
    const { Map } = await google.maps.importLibrary("maps");
    const map = new Map(document.getElementById("map"), {
      center: { lat: 47.4836, lng: -3.1186 }, zoom: 15, disableDefaultUI: true, zoomControl: true, clickableIcons: false,
    });
    infoBtn = document.createElement("button");
    infoBtn.className = "info-btn";
    infoBtn.type = "button";
    infoBtn.textContent = "i";
    infoBtn.setAttribute("aria-label", "Informations pratiques");
    infoBtn.addEventListener("animationend", (e) => { if (e.animationName === "jack") infoBtn.classList.remove("nudge"); });
    infoBtn.addEventListener("click", () => { overlay.hidden = false; });
    map.controls[google.maps.ControlPosition.TOP_LEFT].push(infoBtn);
    setTimeout(() => { nudge(); setInterval(nudge, EVERY_MS); }, FIRST_MS);
  };

  fetch("/api/config").then((r) => r.json()).then(({ googleMapsKey }) => {
    const s = document.createElement("script");
    s.src = `https://maps.googleapis.com/maps/api/js?key=${googleMapsKey}&loading=async&callback=initMap&v=weekly`;
    s.async = true;
    document.head.append(s);
  });
</script>
</body>
</html>
