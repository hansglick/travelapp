<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Démo rues qui battent</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; }
  header h1 { margin: 0; font-size: 1.05rem; font-weight: 600; }
  header small { display: block; color: #999; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choices button {
    padding: 8px 14px; border: 1px solid #444; border-radius: 999px; background: none; color: #ccc;
    font: 600 0.85rem system-ui, sans-serif; cursor: pointer;
  }
  .choices button.active { border-color: #e4572e; background: #e4572e; color: #fff; }
  #map { flex: 1; margin: 0 16px 16px; border-radius: 14px; overflow: hidden; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Démo : les rues de la « Découverte de la ville » qui battent</h1>
      <small>Vraies rues de Quiberon tracées par Google. Toutes battent en même temps, comme un seul cœur.</small>
    </div>
    <div class="choices">
      <button type="button" data-anim="heart" class="active">1. Battement de cœur</button>
      <button type="button" data-anim="breath">2. Respiration lente</button>
      <button type="button" data-anim="flow">3. Pouls qui circule</button>
      <button type="button" data-anim="none">Sans animation</button>
    </div>
  </header>
  <div id="map"></div>

<script>
  // Tracés obtenus pendant le test de la découverte à Quiberon (Google Geocoding + Routes)
  const STREETS = [
    [[47.47268,-3.0899],[47.47262,-3.08999],[47.47268,-3.09017],[47.4739,-3.09288],[47.47396,-3.09292],[47.47344,-3.09901],[47.47344,-3.09908],[47.4735,-3.09929],[47.47346,-3.0996],[47.47342,-3.10031],[47.47346,-3.10072],[47.47372,-3.10243],[47.47406,-3.10409],[47.47421,-3.1047],[47.4742,-3.10475],[47.47421,-3.10503],[47.47414,-3.10502],[47.4741,-3.10538],[47.47442,-3.10546],[47.47494,-3.10518],[47.47493,-3.10531],[47.47497,-3.10566]],
    [[47.48072,-3.11887],[47.48077,-3.11884],[47.4809,-3.11883],[47.48107,-3.11877],[47.48196,-3.11878],[47.48189,-3.12044],[47.48194,-3.12057],[47.4822,-3.12025],[47.48245,-3.12008],[47.48267,-3.11998],[47.48307,-3.11983],[47.48332,-3.11957],[47.48338,-3.11962],[47.48357,-3.11974],[47.48359,-3.11984],[47.48365,-3.11988],[47.48368,-3.11998],[47.48384,-3.12014]],
    [[47.47965,-3.12125],[47.47994,-3.12132],[47.47976,-3.12105],[47.47961,-3.12045],[47.47947,-3.11967],[47.47933,-3.11854],[47.47933,-3.11836],[47.47929,-3.11817],[47.47887,-3.11699],[47.4797,-3.1163],[47.47974,-3.11614],[47.47967,-3.11537],[47.47959,-3.11498],[47.47952,-3.11475],[47.47959,-3.11453],[47.48009,-3.11332],[47.4804,-3.11368],[47.48041,-3.11372],[47.48038,-3.11334],[47.48031,-3.11282],[47.48027,-3.11275]],
  ];
  const COLOR = "#e4572e"; // couleur du groupe « Découverte de la ville » (ici la 1re, orange)

  let lines = [], halos = [], flows = [];
  let mode = "heart", frame = null, started = performance.now();

  // Intensité du halo (0 à 1) selon le temps, pour chaque animation
  function intensity(t) {
    if (mode === "heart") {
      // « boum-boum » : deux pulsations rapprochées puis repos ; un battement toutes les 2,2 s
      const x = (t % 2200) / 2200;
      const beat = (center, width) => Math.max(0, 1 - Math.abs(x - center) / width);
      return Math.max(beat(0.08, 0.07), 0.75 * beat(0.24, 0.07));
    }
    if (mode === "breath") return 0.5 - 0.5 * Math.cos((2 * Math.PI * (t % 3600)) / 3600); // 3,6 s
    return 0;
  }

  function animate(now) {
    const t = now - started;
    const k = intensity(t);
    for (const halo of halos) {
      halo.setOptions({ strokeOpacity: mode === "flow" || mode === "none" ? 0 : 0.08 + 0.32 * k, strokeWeight: 14 + 16 * k });
    }
    if (mode === "flow") {
      // une lueur parcourt chaque rue d'un bout à l'autre en 3 s (toutes en même temps)
      const offset = `${((t % 3000) / 3000) * 100}%`;
      for (const flow of flows) {
        const icons = flow.get("icons");
        icons[0].offset = offset;
        flow.set("icons", icons);
      }
    }
    frame = requestAnimationFrame(animate);
  }

  function setMode(next) {
    mode = next;
    started = performance.now();
    document.querySelectorAll(".choices button").forEach((b) => b.classList.toggle("active", b.dataset.anim === next));
    flows.forEach((f) => f.setMap(next === "flow" ? f.get("mapRef") : null));
    if (!frame) frame = requestAnimationFrame(animate);
  }

  document.querySelectorAll(".choices button").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.anim)));
  // Onglet en arrière-plan : l'animation s'arrête (économie de batterie), reprend au retour
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { cancelAnimationFrame(frame); frame = null; }
    else if (!frame) frame = requestAnimationFrame(animate);
  });

  window.initMap = async () => {
    const { Map } = await google.maps.importLibrary("maps");
    const map = new Map(document.getElementById("map"), {
      center: { lat: 47.4785, lng: -3.108 }, zoom: 15, disableDefaultUI: true, zoomControl: true, clickableIcons: false,
    });
    for (const street of STREETS) {
      const path = street.map(([lat, lng]) => ({ lat, lng }));
      // Halo : ligne large et transparente sous la rue, c'est lui qui pulse
      halos.push(new google.maps.Polyline({ map, path, strokeColor: COLOR, strokeOpacity: 0.1, strokeWeight: 14, zIndex: 1, clickable: false }));
      // La rue elle-même, nette
      lines.push(new google.maps.Polyline({ map, path, strokeColor: COLOR, strokeOpacity: 0.65, strokeWeight: 7, zIndex: 2, clickable: false }));
      // Pouls qui circule : un point lumineux qui avance le long de la rue
      const flow = new google.maps.Polyline({
        path, strokeOpacity: 0, zIndex: 3, clickable: false,
        icons: [{ icon: { path: google.maps.SymbolPath.CIRCLE, scale: 7, fillColor: "#fff3c4", fillOpacity: 0.95, strokeColor: COLOR, strokeWeight: 3 }, offset: "0%" }],
      });
      flow.set("mapRef", map);
      flows.push(flow);
    }
    setMode("heart");
  };

  fetch("/api/config").then((r) => r.json()).then(({ googleMapsKey }) => {
    const s = document.createElement("script");
    s.src = `https://maps.googleapis.com/maps/api/js?key=${googleMapsKey}&loading=async&callback=initMap&v=weekly`;
    s.async = true;
    document.head.append(s);
  });
</script>
</body>
</html>
